name: Advance velox PR create

on:
  schedule:
    # yamllint disable-line rule:quoted-strings
    - cron: '0 9 * * *' # Daily at 09:00 UTC
  workflow_dispatch:
    inputs:
      force_advance:
        description: Force advance velox
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NOTIFICATION_GROUP: ${{ vars.VELOX_UPDATE_NOTIFICATION_GROUP || '@prestodb/team-velox' }}
  BASE_BRANCH: ${{ github.event_name == 'schedule' && 'master' || github.ref_name }}
  VELOX_UPDATE_BRANCH: velox-update
  FORCE_ADVANCE: ${{ github.event_name == 'schedule' || github.event.inputs.force_advance == 'true' }}

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PRESTODB_CI_TOKEN }}
          ref: ${{ env.BASE_BRANCH }}
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Check for existing PR
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.PRESTODB_CI_TOKEN }}
        run: |
          # Check if PR already exists for this branch
          EXISTING_PR=$(gh pr list --head "${{ env.VELOX_UPDATE_BRANCH }}" --base "${{ env.BASE_BRANCH }}" --state open --json number,url --jq '.[0]')

          if [ -n "$EXISTING_PR" ] && [ "$EXISTING_PR" != "null" ]; then
            echo "pr_exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$(echo "$EXISTING_PR" | jq -r '.number')" >> $GITHUB_OUTPUT
            echo "pr_url=$(echo "$EXISTING_PR" | jq -r '.url')" >> $GITHUB_OUTPUT
            echo "Found existing PR: $(echo "$EXISTING_PR" | jq -r '.url')"
          else
            echo "pr_exists=false" >> $GITHUB_OUTPUT
            echo "No existing PR found"
          fi

      - name: Check for new Velox changes
        id: check_new_changes
        run: |
          # Determine current commit based on force_advance flag and PR existence
          cd presto-native-execution/velox
          if [ "${{ env.FORCE_ADVANCE }}" = "true" ] || [ "${{ steps.check_pr.outputs.pr_exists }}" != "true" ]; then
            CURRENT_COMMIT=$(git rev-parse HEAD)
            echo "Using base branch's velox commit"
          else
            if git fetch origin "${{ env.VELOX_UPDATE_BRANCH }}" 2>/dev/null; then
              CURRENT_COMMIT=$(git ls-tree "origin/${{ env.VELOX_UPDATE_BRANCH }}" presto-native-execution/velox | awk '{print $3}')
              echo "Using velox commit from PR branch"
            else
              CURRENT_COMMIT=$(git rev-parse HEAD)
              echo "PR branch not found, using base branch's velox commit"
            fi
          fi

          # Get commit details for current and latest commits
          for commit in "$CURRENT_COMMIT" "origin/main"; do
            if [ "$commit" = "$CURRENT_COMMIT" ]; then
              prefix="current"
            else
              prefix="latest"
              git fetch origin main
              commit=$(git rev-parse origin/main)
            fi

            echo "${prefix}_commit=$commit" >> $GITHUB_OUTPUT
            echo "${prefix}_commit_short=$(git rev-parse --short $commit)" >> $GITHUB_OUTPUT
            echo "${prefix}_date=$(git show -s --format=%ci $commit | cut -d' ' -f1)" >> $GITHUB_OUTPUT
            echo "${prefix}_title=$(git show -s --format=%s $commit)" >> $GITHUB_OUTPUT
          done

          # Check if new changes are available
          if [ "$CURRENT_COMMIT" != "$(git rev-parse origin/main)" ]; then
            echo "new_changes_available=true" >> $GITHUB_OUTPUT
            echo "New Velox changes available"
          else
            echo "new_changes_available=false" >> $GITHUB_OUTPUT
            echo "Velox is up to date"
          fi

      - name: Notify about new changes on existing PR
        if: steps.check_pr.outputs.pr_exists == 'true' && steps.check_new_changes.outputs.new_changes_available == 'true' && env.FORCE_ADVANCE != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRESTODB_CI_TOKEN }}
        run: |
          # Notify about new changes without updating the PR
          VELOX_REPO="https://github.com/facebookincubator/velox"

          gh pr comment ${{ steps.check_pr.outputs.pr_number }} --body "🔔 **New Velox Changes Available**

          New changes are available in the Velox repository:

          - **Current commit:** \`${{ steps.check_new_changes.outputs.current_commit_short }}\` ${{ steps.check_new_changes.outputs.current_date }} [${{ steps.check_new_changes.outputs.current_title }}]($VELOX_REPO/commits/${{ steps.check_new_changes.outputs.current_commit }})
          - **Latest commit:** \`${{ steps.check_new_changes.outputs.latest_commit_short }}\` ${{ steps.check_new_changes.outputs.latest_date }} [${{ steps.check_new_changes.outputs.latest_title }}]($VELOX_REPO/commits/${{ steps.check_new_changes.outputs.latest_commit }})

          ${{ env.NOTIFICATION_GROUP }} To update this PR with the latest changes, re-run this workflow with \`force_advance: true\`."

      - name: Update Velox submodule
        if: (steps.check_pr.outputs.pr_exists != 'true' || env.FORCE_ADVANCE == 'true') && steps.check_new_changes.outputs.new_changes_available == 'true'
        run: |
          git -C presto-native-execution/velox checkout main
          git -C presto-native-execution/velox pull

      - name: Check for changes after update
        if: (steps.check_pr.outputs.pr_exists != 'true' || env.FORCE_ADVANCE == 'true') && steps.check_new_changes.outputs.new_changes_available == 'true'
        id: check_changes
        run: |
          if git diff --quiet presto-native-execution/velox; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected in Velox submodule"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            VELOX_COMMIT=$(cd presto-native-execution/velox && git rev-parse HEAD)
            echo "velox_commit=$VELOX_COMMIT" >> $GITHUB_OUTPUT
            echo "Changes detected in Velox submodule (commit: $VELOX_COMMIT)"
          fi

      - name: Create branch and push changes
        if: (steps.check_pr.outputs.pr_exists != 'true' || env.FORCE_ADVANCE == 'true') && steps.check_changes.outputs.has_changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.PRESTODB_CI_TOKEN }}
        run: |
          # Push velox submodule update to branch
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git switch "${{ env.BASE_BRANCH }}"
          git switch -C "${{ env.VELOX_UPDATE_BRANCH }}"
          git add presto-native-execution/velox
          git commit -m "chore(ci): Advance velox ($(date +'%Y-%m-%d'))"
          git push -f origin "${{ env.VELOX_UPDATE_BRANCH }}"

      - name: Create or Update Pull Request
        if: (steps.check_pr.outputs.pr_exists != 'true' || env.FORCE_ADVANCE == 'true') && steps.check_changes.outputs.has_changes == 'true'
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.PRESTODB_CI_TOKEN }}
        run: |
          # Create or update PR with velox changes
          PR_TITLE="chore(ci): Advance velox ($(date +'%Y-%m-%d'))"
          VELOX_REPO="https://github.com/facebookincubator/velox"

          cat > /tmp/pr_body.txt <<EOF
          **Velox Update Information:**
          - **Commit:** \`${{ steps.check_new_changes.outputs.latest_commit_short }}\` ${{ steps.check_new_changes.outputs.latest_date }} [${{ steps.check_new_changes.outputs.latest_title }}]($VELOX_REPO/commits/${{ steps.check_new_changes.outputs.latest_commit }})

          ---

          \`\`\`
          == NO RELEASE NOTE ==
          \`\`\`

          ## Summary by Sourcery

          Chores:
          - Update the Velox dependency reference under presto-native-execution to the latest desired commit.
          EOF

          if [ "${{ steps.check_pr.outputs.pr_exists }}" = "true" ]; then
            # Update existing PR
            echo "pr_url=${{ steps.check_pr.outputs.pr_url }}" >> $GITHUB_OUTPUT
            echo "pr_number=${{ steps.check_pr.outputs.pr_number }}" >> $GITHUB_OUTPUT

            gh pr edit ${{ steps.check_pr.outputs.pr_number }} --title "$PR_TITLE" --body-file /tmp/pr_body.txt
            echo "Updated existing PR #${{ steps.check_pr.outputs.pr_number }}"
          else
            # Create new PR
            PR_URL=$(gh pr create --title "$PR_TITLE" --body-file /tmp/pr_body.txt --base "${{ env.BASE_BRANCH }}" --head "${{ env.VELOX_UPDATE_BRANCH }}")
            PR_NUMBER=$(echo "$PR_URL" | grep -oE '[0-9]+$')

            echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
            echo "Created new PR #$PR_NUMBER: $PR_URL"
          fi

      - name: Set PR info for summary
        id: pr_info
        run: |
          # Determine which PR info to use for summary
          if [ "${{ steps.check_pr.outputs.pr_exists }}" = "true" ] && [ "${{ env.FORCE_ADVANCE }}" != "true" ]; then
            echo "pr_number=${{ steps.check_pr.outputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "pr_url=${{ steps.check_pr.outputs.pr_url }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ steps.create_pr.outputs.pr_number }}" >> $GITHUB_OUTPUT
            echo "pr_url=${{ steps.create_pr.outputs.pr_url }}" >> $GITHUB_OUTPUT
          fi

      - name: Summary
        if: always()
        run: |
          # Generate job summary
          VELOX_REPO="https://github.com/facebookincubator/velox"
          echo "## Create PR Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ steps.check_pr.outputs.pr_exists }}" = "true" ] && [ "${{ env.FORCE_ADVANCE }}" != "true" ]; then
            # Existing PR found, not forced to update
            echo "ℹ️ Existing PR found" >> $GITHUB_STEP_SUMMARY
            echo "📝 Pull Request: ${{ steps.pr_info.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY

            if [ "${{ steps.check_new_changes.outputs.new_changes_available }}" = "true" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "🔔 **New Velox changes available:**" >> $GITHUB_STEP_SUMMARY
              echo "- **Current commit:** \`${{ steps.check_new_changes.outputs.current_commit_short }}\` ${{ steps.check_new_changes.outputs.current_date }} [${{ steps.check_new_changes.outputs.current_title }}]($VELOX_REPO/commits/${{ steps.check_new_changes.outputs.current_commit }})" >> $GITHUB_STEP_SUMMARY
              echo "- **Latest commit:** \`${{ steps.check_new_changes.outputs.latest_commit_short }}\` ${{ steps.check_new_changes.outputs.latest_date }} [${{ steps.check_new_changes.outputs.latest_title }}]($VELOX_REPO/commits/${{ steps.check_new_changes.outputs.latest_commit }})" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "💡 Re-run with \`force_advance: true\` to update the PR" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ steps.check_new_changes.outputs.new_changes_available }}" = "false" ]; then
            # No new changes available
            echo "ℹ️ Velox is up to date at commit: \`${{ steps.check_new_changes.outputs.current_commit_short }}\` ${{ steps.check_new_changes.outputs.current_date }} [${{ steps.check_new_changes.outputs.current_title }}]($VELOX_REPO/commits/${{ steps.check_new_changes.outputs.current_commit }})" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check_changes.outputs.has_changes }}" = "true" ]; then
            # PR created or updated
            echo "✅ Velox submodule updated to commit: \`${{ steps.check_new_changes.outputs.latest_commit_short }}\` ${{ steps.check_new_changes.outputs.latest_date }} [${{ steps.check_new_changes.outputs.latest_title }}]($VELOX_REPO/commits/${{ steps.check_new_changes.outputs.latest_commit }})" >> $GITHUB_STEP_SUMMARY
            echo "📝 Pull Request: ${{ steps.pr_info.outputs.pr_url }}" >> $GITHUB_STEP_SUMMARY
          fi
